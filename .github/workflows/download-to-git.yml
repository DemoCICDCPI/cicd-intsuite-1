name: Download Integration Content to Git

on:
  workflow_dispatch:

jobs:
  call-download-workflow:
    uses: iamsubbash/cicd-actions-1/.github/workflows/download-btp-to-git.yml@main
    with:
      workflow-ref: main
      source-env: DEV
      target-ref: main
      ids: "DEMO"
      mode: "IntegrationPackages"
      commit-message: "Import DEMO package from BTP"
      btp-api-user: ${{ vars.BTP_CLIENT_ID }}
      btp-tec-user: ${{ vars.BTP_CLIENT_ID }}
      btp-token-url: ${{ vars.BTP_TOKEN_URL }}
      btp-api-url: ${{ vars.BTP_SERVICE_URL }}
      git-cicd-orgrepo: "iamsubbash/cicd-actions-1"
    secrets:
      BTP_API_PASSWORD: ${{ secrets.BTP_CLIENT_SECRET }}
      BTP_TEC_PASSWORD: ${{ secrets.BTP_CLIENT_SECRET }}
