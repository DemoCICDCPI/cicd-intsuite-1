name: Download Integration Content to Git

on:
  workflow_dispatch:

jobs:
  call-download-workflow:
    uses: iamsubbash/cicd-actions-1/.github/workflows/download-btp-to-git.yml@main
    with:
      workflow-ref: main
      source-env: DEV
    secrets:
      BTP_CLIENT_ID: ${{ secrets.BTP_CLIENT_ID }}
      BTP_CLIENT_SECRET: ${{ secrets.BTP_CLIENT_SECRET }}
      BTP_TOKEN_URL: ${{ secrets.BTP_TOKEN_URL }}
      BTP_SERVICE_URL: ${{ secrets.BTP_SERVICE_URL }}
